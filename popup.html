<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="title">Asset Clipper</span>
  </div>

  <div class="vault-row">
    <span id="vault-path-display" class="not-set">No vault folder selected</span>
    <button id="select-vault-btn">Select vault folder</button>
  </div>

  <div id="status" class="status"></div>

  <div id="no-images" style="display:none;" class="muted">No assets found in main content.</div>

  <ul id="image-list"></ul>

  <button id="clip-btn" disabled>Scan for Images</button>

  <script src="popup.js"></script>
</body>
</html>
